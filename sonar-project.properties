# Análise estática no SonarCloud (executada pelo CI após os testes)
sonar.projectKey=Wellerson-M_SIGOF
sonar.organization=wellerson-m
sonar.projectName=SIGOF

sonar.sources=backend/src
sonar.tests=backend/src
sonar.test.inclusions=backend/src/**/*.test.ts
sonar.exclusions=backend/src/**/*.test.ts

# Cobertura gerada pelo Vitest (reporter lcov)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
# Mesmas exclusões do vitest.config.ts: ponto de entrada e scripts do banco
sonar.coverage.exclusions=backend/src/http/server.ts,backend/src/banco/**
