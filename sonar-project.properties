# Análise estática no SonarCloud (executada pelo CI após os testes)
sonar.projectKey=Wellerson-M_SIGOF
sonar.organization=wellerson-m
sonar.projectName=SIGOF

sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=backend/src/**/*.test.ts,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.exclusions=backend/src/**/*.test.ts,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# Cobertura gerada pelo Vitest (reporter lcov) nos dois projetos
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
# Mesmas exclusões dos vitest.config: ponto de entrada, scripts do banco e
# amarração do Next sem lógica própria
sonar.coverage.exclusions=backend/src/http/server.ts,backend/src/banco/**,frontend/src/app/layout.tsx,frontend/src/app/page.tsx,frontend/src/app/(sistema)/layout.tsx
