<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - SIGOF</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#405f91",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#a9c7ff",
                        "on-tertiary-fixed": "#360f00",
                        "surface": "#faf9fe",
                        "on-primary-fixed-variant": "#264778",
                        "surface-container-highest": "#e3e2e7",
                        "primary": "#001736",
                        "surface-dim": "#dad9de",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#d6e3ff",
                        "on-secondary-fixed": "#0b1c30",
                        "on-surface-variant": "#43474f",
                        "primary-container": "#002b5b",
                        "on-error": "#ffffff",
                        "on-primary-container": "#7594ca",
                        "secondary-container": "#d0e1fb",
                        "error-container": "#ffdad6",
                        "on-surface": "#1a1c1f",
                        "tertiary-container": "#4f1c02",
                        "surface-bright": "#faf9fe",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#713619",
                        "secondary": "#505f76",
                        "secondary-fixed-dim": "#b7c8e1",
                        "outline-variant": "#c4c6d0",
                        "inverse-primary": "#a9c7ff",
                        "surface-container": "#eeedf2",
                        "surface-container-low": "#f4f3f8",
                        "inverse-surface": "#2f3034",
                        "on-secondary-container": "#54647a",
                        "surface-variant": "#e3e2e7",
                        "on-tertiary-container": "#cd805d",
                        "on-secondary-fixed-variant": "#38485d",
                        "tertiary-fixed": "#ffdbcd",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#001b3d",
                        "on-background": "#1a1c1f",
                        "background": "#faf9fe",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#ffb596",
                        "outline": "#747780",
                        "inverse-on-surface": "#f1f0f5",
                        "surface-container-high": "#e8e7ec",
                        "tertiary": "#2f0c00",
                        "secondary-fixed": "#d3e4fe"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "inline_padding": "12px",
                        "sidebar_width": "260px",
                        "container_padding": "32px",
                        "base": "8px",
                        "card_gap": "24px",
                        "stack_padding": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display": ["Inter"],
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "title-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "display": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["11px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "title-lg": ["18px", { "lineHeight": "1.5", "fontWeight": "600" }]

                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-primary min-h-screen w-full flex items-center justify-center p-4">
<!-- Login Container -->
<main class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl shadow-[0_8px_32px_rgba(0,0,0,0.15)] p-container_padding flex flex-col gap-card_gap relative overflow-hidden">
<!-- Subtle top accent line -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary-container"></div>
<!-- Header / Branding -->
<header class="flex flex-col items-center text-center gap-base pt-4">
<div class="w-16 h-16 bg-primary-fixed rounded-xl flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-primary-container text-4xl" style="font-variation-settings: 'FILL' 1;">
                    local_shipping
                </span>
</div>
<h1 class="font-display text-display text-primary tracking-tight">SIGOF</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
                Sistema de Gestão de Ocorrências de Frete
            </p>
</header>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-stack_padding mt-2" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="email">E-mail corporativo</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-lg">
                        mail
                    </span>
<input class="w-full pl-10 pr-3 py-3 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-all placeholder:text-outline" id="email" name="email" placeholder="nome.sobrenome@empresa.com.br" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="password">Senha</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-lg">
                        lock
                    </span>
<input class="w-full pl-10 pr-3 py-3 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-all placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Actions Row -->
<div class="flex justify-end items-center">
<a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors hover:underline" href="#">
                    Esqueci minha senha
                </a>
</div>
<!-- Submit Button -->
<button class="w-full mt-2 bg-primary-container text-surface-container-lowest font-title-lg text-title-lg py-3 rounded-lg hover:bg-primary transition-colors flex items-center justify-center gap-2 shadow-sm" type="submit">
                Entrar
                <span class="material-symbols-outlined text-xl">
                    arrow_forward
                </span>
</button>
</form>
<!-- Footer / Context -->
<footer class="mt-4 pt-4 border-t border-outline-variant/30 text-center">
<p class="font-label-sm text-label-sm text-outline flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[14px]">info</span>
                Acesso restrito a colaboradores autorizados.
            </p>
</footer>
</main>
</body></html>
