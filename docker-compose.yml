# Ambiente de desenvolvimento do SIGOF (RFC seção 5.8).
# Sobe as dependências de infraestrutura; a API roda fora do compose
# durante o desenvolvimento (npm run dev), para manter o hot reload.
#
#   docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: sigof-postgres
    environment:
      POSTGRES_USER: sigof
      POSTGRES_PASSWORD: sigof
      POSTGRES_DB: sigof
    # Só a própria máquina acessa; ninguém na rede local enxerga o banco
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigof -d sigof"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Storage de anexos S3-compatível. Substitui o AWS S3 em desenvolvimento
  # sem alterar a aplicação (RFC seção 5.4). SeaweedFS no lugar do MinIO,
  # cuja imagem deixou de ser publicada no Docker Hub.
  storage:
    image: chrislusf/seaweedfs:4.48
    container_name: sigof-storage
    command: server -dir=/data -s3 -s3.port=9000
    environment:
      # Credencial de administrador do S3 (acesso anônimo é recusado)
      AWS_ACCESS_KEY_ID: sigof
      AWS_SECRET_ACCESS_KEY: sigof-secret
    # Só a própria máquina acessa; ninguém na rede local enxerga o storage
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  storage-data:
