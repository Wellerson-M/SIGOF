# Pipeline de integração contínua do SIGOF (RFC seção 5.9).
# Roda a cada push e pull request; o merge na main depende da aprovação
# deste workflow (quality gate).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — lint, typecheck e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Postgres de verdade, igual ao do docker-compose, para validar as
    # migrações e o seed a cada PR
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sigof
          POSTGRES_PASSWORD: sigof
          POSTGRES_DB: sigof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigof -d sigof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sigof:sigof@localhost:5432/sigof?schema=public
      JWT_SECRET: segredo-do-ci-com-mais-de-32-caracteres
      # Só um sim/não: o token em si fica restrito ao passo do SonarCloud,
      # longe do npm ci e dos testes, que executam código de terceiros
      TEM_SONAR: ${{ secrets.SONAR_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: o SonarCloud usa o blame para saber o que é código novo
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Verificação de tipos (tsc)
        run: npm run typecheck

      # Antes dos testes: os de integração usam este banco
      - name: Migrações aplicam do zero e o schema bate com elas
        run: |
          npm run db:deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Testes unitários e de integração + cobertura (mínimo 75% — RFC 5.6)
        run: npm run test:coverage

      - name: Seed roda sem erro
        run: npm run db:seed

      - name: Análise estática (SonarCloud)
        if: env.TEM_SONAR == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # PRs do Dependabot não recebem os segredos do repositório e podem
      # pular a análise; em qualquer outro caso, pular é erro visível
      - name: Exige que a análise tenha rodado
        if: env.TEM_SONAR != 'true' && github.actor != 'dependabot[bot]'
        run: |
          echo "::error::SONAR_TOKEN ausente: a análise do SonarCloud não rodou."
          exit 1

      - name: Auditoria de dependências
        run: npm audit --audit-level=high
        continue-on-error: true
